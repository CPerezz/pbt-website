<link rel="stylesheet" href="bench.css">
<style>
  .tiles { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; margin-top: 44px }
  .tile { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 10px; border: 1px solid rgba(51,255,51,.25); background: rgba(12,16,24,.9); color: var(--ink); text-decoration: none; transition: border-color .2s, box-shadow .2s }
  a.tile:hover { color: var(--ink); border-color: var(--green); box-shadow: 0 0 28px rgba(51,255,51,.12) }
  .tile.next { border-style: dashed; border-color: rgba(226,230,226,.18); opacity: .55 }
  .lane { display: grid; grid-template-columns: 96px minmax(0, 1fr) 112px; gap: 12px; align-items: center }
  .cores { display: grid; grid-template-columns: repeat(10, 12px); gap: 4px }
  .cores i { width: 12px; height: 12px; border-radius: 2px; background: rgba(226,230,226,.08); border: 1px solid rgba(226,230,226,.14) }
  .cores i.on { background: var(--green); border-color: var(--green); box-shadow: 0 0 8px rgba(51,255,51,.5) }
  @media (max-width: 860px) { .tiles { grid-template-columns: 1fr } .lane { grid-template-columns: 80px minmax(0, 1fr) 96px } }
</style>
</head>
